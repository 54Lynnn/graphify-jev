<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0c121e"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEmerald" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="50%" cy="20%" r="30%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .brand-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif; font-weight: 800; font-size: 38px; letter-spacing: -0.8px; }
    .brand-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif; font-weight: 500; font-size: 15px; fill: #94a3b8; }
    .brand-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif; font-weight: 400; font-size: 13.5px; fill: #cbd5e1; }
    .mono-pill { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 600; }
    .grid-line { stroke: rgba(255, 255, 255, 0.035); stroke-width: 1; }
  </style>

  <!-- Card Frame -->
  <rect x="1" y="1" width="958" height="318" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Subtle Matrix Grid -->
  <g class="grid-line">
    <line x1="0" y1="40" x2="960" y2="40"/>
    <line x1="0" y1="80" x2="960" y2="80"/>
    <line x1="0" y1="120" x2="960" y2="120"/>
    <line x1="0" y1="160" x2="960" y2="160"/>
    <line x1="0" y1="200" x2="960" y2="200"/>
    <line x1="0" y1="240" x2="960" y2="240"/>
    <line x1="0" y1="280" x2="960" y2="280"/>
    <line x1="80" y1="0" x2="80" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="320"/>
    <line x1="240" y1="0" x2="240" y2="320"/>
    <line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="560" y1="0" x2="560" y2="320"/>
    <line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="720" y1="0" x2="720" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="880" y1="0" x2="880" y2="320"/>
  </g>

  <!-- Ambient Glows -->
  <rect x="0" y="0" width="960" height="320" fill="url(#glowCyan)" rx="16"/>
  <rect x="0" y="0" width="960" height="320" fill="url(#glowEmerald)" rx="16"/>
  <rect x="0" y="0" width="960" height="320" fill="url(#glowRed)" rx="16"/>

  <!-- Brand Section (Left) -->
  <g transform="translate(48, 50)">
    <!-- Small Tag Badge -->
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#1e293b" fill-opacity="0.8" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
    <circle cx="12" cy="13" r="4" fill="#38bdf8"/>
    <text x="24" y="17" class="mono-pill" fill="#38bdf8">ARCHITECTURE CO-PILOT</text>

    <!-- Main Title -->
    <text x="0" y="65" class="brand-title" fill="url(#textGrad)">Graphify-Jev</text>

    <!-- Subtitle -->
    <text x="0" y="96" class="brand-subtitle">AI 代码连续决策导航仪 · 架构卷帘重构向导</text>

    <!-- Descriptive Pitch -->
    <text x="0" y="126" class="brand-desc">拒绝只看不动的被动代码地图。融合本地零成本 AST 拓扑与 Jev 150ms 连续决策直出，</text>
    <text x="0" y="148" class="brand-desc">为 Coding Agent 注入穿透寻种、修枝确诊、分步重构与 60FPS 架构卷帘见证全闭环能力。</text>

    <!-- Quick Metrics Pills -->
    <g transform="translate(0, 175)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="138" height="30" rx="8" fill="#0f172a" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <circle cx="14" cy="15" r="3.5" fill="#ef4444"/>
      <text x="26" y="19" class="mono-pill" fill="#f8fafc">Jev 150ms 直出</text>

      <!-- Pill 2 -->
      <rect x="148" y="0" width="148" height="30" rx="8" fill="#0f172a" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <circle cx="162" cy="15" r="3.5" fill="#38bdf8"/>
      <text x="174" y="19" class="mono-pill" fill="#f8fafc">单 Canvas 60FPS</text>

      <!-- Pill 3 -->
      <rect x="306" y="0" width="154" height="30" rx="8" fill="#0f172a" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <circle cx="320" cy="15" r="3.5" fill="#34d399"/>
      <text x="332" y="19" class="mono-pill" fill="#f8fafc">112 Tests 100% 绿灯</text>

      <!-- Pill 4 -->
      <rect x="470" y="0" width="116" height="30" rx="8" fill="#0f172a" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <circle cx="484" cy="15" r="3.5" fill="#a855f7"/>
      <text x="496" y="19" class="mono-pill" fill="#f8fafc">8899 本地大屏</text>
    </g>
  </g>

  <!-- Right Visual Feature (Interactive Wireframe Simulation) -->
  <g transform="translate(685, 38)" filter="url(#subtleShadow)">
    <rect x="0" y="0" width="228" height="244" rx="12" fill="#0b1120" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    
    <!-- Mini Header -->
    <rect x="0" y="0" width="228" height="28" rx="12" fill="#131c31"/>
    <rect x="0" y="16" width="228" height="12" fill="#131c31"/>
    <circle cx="14" cy="14" r="3.5" fill="#ef4444" fill-opacity="0.8"/>
    <circle cx="26" cy="14" r="3.5" fill="#eab308" fill-opacity="0.8"/>
    <circle cx="38" cy="14" r="3.5" fill="#22c55e" fill-opacity="0.8"/>
    <text x="60" y="18" class="mono-pill" fill="#64748b" font-size="9.5">CURTAIN_COMPARE.VIEW</text>

    <!-- Canvas Inner Area -->
    <!-- Left: Before (Malignant Red Mesh) -->
    <path d="M 50 80 Q 75 110 65 140 T 35 180" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1.2" fill="none"/>
    <path d="M 65 140 Q 30 110 50 80" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1.2" fill="none"/>
    <circle cx="65" cy="140" r="14" fill="#ef4444" fill-opacity="0.25" stroke="#ef4444" stroke-width="2"/>
    <circle cx="65" cy="140" r="6" fill="#f87171"/>
    <circle cx="35" cy="95" r="4" fill="#fca5a5"/>
    <circle cx="35" cy="180" r="5" fill="#fca5a5"/>
    <text x="25" y="65" class="mono-pill" fill="#f87171" font-size="9">246° [D]</text>

    <!-- Center Curtain Line -->
    <line x1="114" y1="28" x2="114" y2="244" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2"/>
    <!-- Center Split Handle -->
    <rect x="108" y="122" width="12" height="28" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1.2"/>
    <line x1="112" y1="131" x2="112" y2="141" stroke="#ffffff" stroke-width="1"/>
    <line x1="116" y1="131" x2="116" y2="141" stroke="#ffffff" stroke-width="1"/>

    <!-- Right: After (Emerald Green Micro Modules) -->
    <path d="M 145 95 Q 165 125 180 100" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.2" fill="none"/>
    <path d="M 165 125 Q 185 160 175 185" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.2" fill="none"/>
    <circle cx="165" cy="125" r="7" fill="#10b981" fill-opacity="0.3" stroke="#34d399" stroke-width="1.8"/>
    <circle cx="165" cy="125" r="3.5" fill="#6ee7b7"/>
    <circle cx="145" cy="95" r="5" fill="#34d399"/>
    <circle cx="180" cy="100" r="5" fill="#34d399"/>
    <circle cx="175" cy="185" r="5" fill="#34d399"/>
    <text x="155" y="65" class="mono-pill" fill="#34d399" font-size="9">35° [A+]</text>

    <!-- Bottom Status Text -->
    <rect x="10" y="210" width="208" height="24" rx="6" fill="#080e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="24" y="226" class="mono-pill" fill="#38bdf8" font-size="9">85.7% 耦合骤降 · 0 破坏</text>
  </g>
</svg>
