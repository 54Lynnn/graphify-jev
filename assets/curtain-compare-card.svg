<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0e1422"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <!-- Border Gradients -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Curtain Divider Gradient -->
    <linearGradient id="curtainLineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="redGlow" cx="28%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="greenGlow" cx="72%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter for node drop shadows -->
    <filter id="nodeGlowRed" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ef4444" flood-opacity="0.7"/>
    </filter>
    <filter id="nodeGlowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#34d399" flood-opacity="0.6"/>
    </filter>
    <filter id="handleShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <style>
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif; font-weight: 700; font-size: 16px; letter-spacing: -0.2px; }
    .mono-data { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
    .label-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif; font-weight: 600; font-size: 12.5px; }
    .node-text { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 10px; font-weight: 500; }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="958" height="418" rx="16" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.5"/>

  <!-- Background Ambient Glows -->
  <rect x="0" y="0" width="480" height="420" fill="url(#redGlow)" rx="16"/>
  <rect x="480" y="0" width="480" height="420" fill="url(#greenGlow)" rx="16"/>

  <!-- Top Header Bar -->
  <rect x="1" y="1" width="958" height="52" rx="16" fill="#0d1320" fill-opacity="0.9"/>
  <rect x="1" y="36" width="958" height="17" fill="#0d1320" fill-opacity="0.9"/>
  <line x1="1" y1="53" x2="959" y2="53" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Header Title -->
  <g transform="translate(24, 16)">
    <circle cx="8" cy="11" r="5" fill="#38bdf8"/>
    <text x="22" y="15" class="title-text" fill="#f8fafc">架构卷帘对比大屏 (Curtain Compare Viewport)</text>
    <rect x="360" y="2" width="128" height="20" rx="10" fill="#1e293b" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <text x="370" y="15" class="mono-data" fill="#38bdf8" font-size="10.5">单 Canvas 60 FPS</text>
  </g>

  <!-- Header Action Endpoint Callout -->
  <g transform="translate(680, 16)">
    <rect x="0" y="0" width="256" height="24" rx="6" fill="#080e1a" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#34d399"/>
    <text x="24" y="16" class="mono-data" fill="#94a3b8" font-size="10.5">http://localhost:8899/curtain</text>
  </g>

  <!-- ================= LEFT SIDE: BEFORE ================= -->
  <g transform="translate(20, 68)">
    <!-- Stage Pill -->
    <rect x="10" y="6" width="168" height="24" rx="12" fill="rgba(239, 68, 68, 0.15)" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1"/>
    <circle cx="22" cy="18" r="4" fill="#ef4444"/>
    <text x="32" y="22" class="label-header" fill="#fca5a5">改造前 (Before · 恶性病灶)</text>

    <!-- Metrics Badges Left -->
    <g transform="translate(10, 40)">
      <text x="0" y="12" class="mono-data" fill="#f87171">上帝类: build_from_json()</text>
      <text x="0" y="28" class="mono-data" fill="#94a3b8">连接度: <tspan fill="#ef4444" font-weight="700">246°</tspan> · 评级: <tspan fill="#ef4444" font-weight="700">[D 高危]</tspan></text>
      <text x="0" y="44" class="mono-data" fill="#64748b">代码规模: 400+ 行杂糅 · 牵连 53 文件</text>
    </g>

    <!-- Network Graph Simulation (Dense Entangled Mesh) -->
    <g transform="translate(40, 90)">
      <!-- Mesh Call Lines -->
      <path d="M 190 110 Q 110 50 70 60" stroke="#ef4444" stroke-opacity="0.35" stroke-width="1.2" fill="none"/>
      <path d="M 190 110 Q 120 150 60 140" stroke="#ef4444" stroke-opacity="0.35" stroke-width="1.2" fill="none"/>
      <path d="M 190 110 Q 140 210 90 200" stroke="#ef4444" stroke-opacity="0.35" stroke-width="1.2" fill="none"/>
      <path d="M 190 110 Q 230 40 260 50" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1.2" fill="none"/>
      <path d="M 190 110 Q 280 140 330 130" stroke="#ef4444" stroke-opacity="0.35" stroke-width="1.2" fill="none"/>
      <path d="M 190 110 Q 250 200 280 210" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1.2" fill="none"/>
      <path d="M 70 60 Q 60 140 90 200" stroke="#ef4444" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
      <path d="M 260 50 Q 330 130 280 210" stroke="#ef4444" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 3" fill="none"/>

      <!-- Peripheral Nodes -->
      <circle cx="70" cy="60" r="7" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
      <text x="82" y="64" class="node-text" fill="#fca5a5">cli.py (caller)</text>

      <circle cx="60" cy="140" r="7" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
      <text x="72" y="144" class="node-text" fill="#fca5a5">extract_json()</text>

      <circle cx="90" cy="200" r="7" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
      <text x="102" y="204" class="node-text" fill="#fca5a5">ghost_resolver</text>

      <circle cx="260" cy="50" r="7" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
      <text x="272" y="54" class="node-text" fill="#fca5a5">networkx.add()</text>

      <circle cx="330" cy="130" r="7" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
      <text x="342" y="134" class="node-text" fill="#fca5a5">community.louvain</text>

      <circle cx="280" cy="210" r="7" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
      <text x="292" y="214" class="node-text" fill="#fca5a5">graph_writer()</text>

      <!-- Center God Node (246°) -->
      <circle cx="190" cy="110" r="22" fill="#7f1d1d" filter="url(#nodeGlowRed)"/>
      <circle cx="190" cy="110" r="16" fill="#b91c1c" stroke="#ffffff" stroke-width="2"/>
      <circle cx="190" cy="110" r="8" fill="#f87171"/>
      <text x="135" y="145" class="mono-data" fill="#ffffff" font-weight="700" font-size="11">build_from_json()</text>
      <text x="165" y="160" class="mono-data" fill="#fca5a5" font-size="9.5">Degree: 246°</text>
    </g>
  </g>

  <!-- ================= CENTER CURTAIN DIVIDER ================= -->
  <g transform="translate(480, 53)">
    <!-- Vertical Divider Line -->
    <line x1="0" y1="0" x2="0" y2="300" stroke="url(#curtainLineGrad)" stroke-width="2"/>
    
    <!-- Top & Bottom Markers -->
    <polygon points="-5,4 5,4 0,12" fill="#38bdf8"/>
    <polygon points="-5,296 5,296 0,288" fill="#38bdf8"/>

    <!-- Center Drag Handle Slider -->
    <g transform="translate(0, 140)" filter="url(#handleShadow)">
      <rect x="-14" y="-24" width="28" height="48" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
      <!-- Gripper lines -->
      <line x1="-5" y1="-10" x2="-5" y2="10" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="0" y1="-10" x2="0" y2="10" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="5" y1="-10" x2="5" y2="10" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Handle Direction Arrow Hint -->
    <rect x="-56" y="195" width="112" height="20" rx="10" fill="#0b1120" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
    <text x="0" y="209" class="mono-data" fill="#38bdf8" font-size="9.5" text-anchor="middle">◀ 左右滑动卷帘 ▶</text>
  </g>

  <!-- ================= RIGHT SIDE: AFTER ================= -->
  <g transform="translate(500, 68)">
    <!-- Stage Pill -->
    <rect x="20" y="6" width="168" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
    <circle cx="32" cy="18" r="4" fill="#10b981"/>
    <text x="42" y="22" class="label-header" fill="#a7f3d0">改造后 (After · 管道解耦)</text>

    <!-- Metrics Badges Right -->
    <g transform="translate(20, 40)">
      <text x="0" y="12" class="mono-data" fill="#34d399">轻量门面: build_from_json()</text>
      <text x="0" y="28" class="mono-data" fill="#94a3b8">连接度: <tspan fill="#34d399" font-weight="700">35° (-85.7%)</tspan> · 评级: <tspan fill="#34d399" font-weight="700">[A+ 健康]</tspan></text>
      <text x="0" y="44" class="mono-data" fill="#64748b">代码规模: 25 行极简门面 · 0 破坏兼容</text>
    </g>

    <!-- Decoupled Pipeline Micro-modules Flow -->
    <g transform="translate(40, 95)">
      <!-- Smooth Pipeline Trajectory -->
      <path d="M 60 110 L 150 50" stroke="#34d399" stroke-opacity="0.5" stroke-width="1.8" fill="none"/>
      <path d="M 150 50 L 250 80" stroke="#34d399" stroke-opacity="0.5" stroke-width="1.8" fill="none"/>
      <path d="M 250 80 L 330 140" stroke="#34d399" stroke-opacity="0.5" stroke-width="1.8" fill="none"/>
      <path d="M 330 140 L 230 190" stroke="#34d399" stroke-opacity="0.5" stroke-width="1.8" fill="none"/>
      <path d="M 230 190 L 60 110" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="3 3" fill="none"/>

      <!-- Node 1: Facade (35°) -->
      <circle cx="60" cy="110" r="14" fill="#064e3b" filter="url(#nodeGlowGreen)"/>
      <circle cx="60" cy="110" r="10" fill="#059669" stroke="#a7f3d0" stroke-width="2"/>
      <circle cx="60" cy="110" r="5" fill="#6ee7b7"/>
      <text x="10" y="140" class="mono-data" fill="#a7f3d0" font-weight="700" font-size="10.5">Facade (35°)</text>

      <!-- Submodule 1: ExtractionPreflight -->
      <circle cx="150" cy="50" r="10" fill="#047857" stroke="#34d399" stroke-width="1.5"/>
      <circle cx="150" cy="50" r="4" fill="#a7f3d0"/>
      <text x="165" y="48" class="node-text" fill="#6ee7b7" font-weight="600">ExtractionPreflight</text>
      <text x="165" y="60" class="node-text" fill="#94a3b8" font-size="8.5">输入校验与AST预检</text>

      <!-- Submodule 2: GhostNodeResolver -->
      <circle cx="250" cy="80" r="10" fill="#047857" stroke="#34d399" stroke-width="1.5"/>
      <circle cx="250" cy="80" r="4" fill="#a7f3d0"/>
      <text x="265" y="78" class="node-text" fill="#6ee7b7" font-weight="600">GhostNodeResolver</text>
      <text x="265" y="90" class="node-text" fill="#94a3b8" font-size="8.5">孤魂节点识别与裁决</text>

      <!-- Submodule 3: GraphAssembler -->
      <circle cx="330" cy="140" r="10" fill="#047857" stroke="#34d399" stroke-width="1.5"/>
      <circle cx="330" cy="140" r="4" fill="#a7f3d0"/>
      <text x="260" y="165" class="node-text" fill="#6ee7b7" font-weight="600">GraphAssembler</text>
      <text x="260" y="177" class="node-text" fill="#94a3b8" font-size="8.5">确定性图谱拓扑构建</text>

      <!-- Submodule 4: PipelineRunner -->
      <circle cx="230" cy="190" r="9" fill="#047857" stroke="#34d399" stroke-width="1.5"/>
      <circle cx="230" cy="190" r="3.5" fill="#a7f3d0"/>
      <text x="145" y="210" class="node-text" fill="#6ee7b7">Pipeline Context</text>
    </g>
  </g>

  <!-- ================= BOTTOM SCOREBOARD RIBBON ================= -->
  <g transform="translate(24, 360)">
    <rect x="0" y="0" width="912" height="42" rx="10" fill="#090e18" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    
    <!-- Item 1: Coupling Drop -->
    <g transform="translate(24, 15)">
      <circle cx="6" cy="7" r="3" fill="#34d399"/>
      <text x="16" y="11" class="mono-data" fill="#94a3b8" font-size="11">耦合度骤降: <tspan fill="#34d399" font-weight="700">246° ➔ 35° (-85.7%)</tspan></text>
    </g>

    <!-- Item 2: Malignant Zeroed -->
    <g transform="translate(260, 15)">
      <circle cx="6" cy="7" r="3" fill="#34d399"/>
      <text x="16" y="11" class="mono-data" fill="#94a3b8" font-size="11">恶性上帝病灶: <tspan fill="#34d399" font-weight="700">1 ➔ 0 (归零)</tspan></text>
    </g>

    <!-- Item 3: Zero Breaking -->
    <g transform="translate(470, 15)">
      <circle cx="6" cy="7" r="3" fill="#38bdf8"/>
      <text x="16" y="11" class="mono-data" fill="#94a3b8" font-size="11">对外调用兼容: <tspan fill="#38bdf8" font-weight="700">227 处 0 破坏</tspan></text>
    </g>

    <!-- Item 4: Tests Passed -->
    <g transform="translate(680, 15)">
      <circle cx="6" cy="7" r="3" fill="#10b981"/>
      <text x="16" y="11" class="mono-data" fill="#94a3b8" font-size="11">测试回归: <tspan fill="#10b981" font-weight="700">112/112 100% 绿灯</tspan></text>
    </g>
  </g>
</svg>
