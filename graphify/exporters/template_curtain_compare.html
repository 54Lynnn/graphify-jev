<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphify-Jev 架构解耦前/后纯正 ComfyUI 激光卷帘对比中心</title>
    <!-- 引入 ECharts 5 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        :root {
            --bg-color: #080c14;
            --panel-bg: rgba(15, 23, 42, 0.94);
            --border-color: #1e293b;
            --accent-cyan: #38bdf8;
            --accent-red: #ef4444;
            --accent-green: #34d399;
            --laser-glow: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body {
            background: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            user-select: none;
        }
        header {
            height: 60px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .badge-comfy {
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: #fff; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 4px;
        }
        .title { font-size: 16px; font-weight: 700; }
        .scoreboard {
            display: flex; align-items: center; gap: 16px; background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08); padding: 5px 16px; border-radius: 20px; font-size: 12px;
        }
        .score-val-old { color: #f87171; text-decoration: line-through; }
        .score-val-new { color: #34d399; font-weight: 800; }

        #viewport-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        #viewport-wrapper.dragging {
            cursor: grabbing;
        }

        /* 统一双层画布叠放容器：保证两画布尺寸 100% 绝对一致 */
        .chart-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        #chart-before {
            z-index: 10;
            background: #080c14;
        }

        #chart-after {
            z-index: 20;
            background: #080c14;
            /* 由 JS 实时通过 clip-path 物理切除 */
        }

        /* 激光分割线轴 */
        #laser-line {
            position: absolute; top: 0; bottom: 0; width: 2px;
            background: linear-gradient(180deg, #38bdf8, #a855f7, #38bdf8);
            box-shadow: 0 0 16px var(--laser-glow), 0 0 32px rgba(56, 189, 248, 0.7);
            z-index: 50; pointer-events: none;
        }
        #laser-line.locked {
            background: linear-gradient(180deg, #fbbf24, #f59e0b, #fbbf24);
            box-shadow: 0 0 18px #fbbf24, 0 0 35px rgba(251, 191, 36, 0.7);
        }
        #laser-handle {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            width: 24px; height: 24px; background: #0f172a;
            border: 2px solid #38bdf8; box-shadow: 0 0 14px #38bdf8;
        }
        #laser-line.locked #laser-handle {
            border-color: #fbbf24; box-shadow: 0 0 16px #fbbf24;
        }

        .floating-label {
            position: absolute; top: 20px; padding: 6px 14px; border-radius: 16px;
            font-size: 12px; font-weight: 700; z-index: 60; pointer-events: none;
        }
        #label-before {
            left: 24px; background: rgba(239, 68, 68, 0.2); border: 1px solid var(--accent-red); color: #fca5a5;
        }
        #label-after {
            right: 24px; background: rgba(16, 185, 129, 0.2); border: 1px solid var(--accent-green); color: #6ee7b7;
        }
        #lock-indicator {
            position: absolute; top: 75px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.92); border: 1px solid #38bdf8; padding: 5px 16px;
            border-radius: 20px; font-size: 12px; font-weight: 600; color: #38bdf8; z-index: 70;
            pointer-events: none; transition: all 0.2s;
        }
        #lock-indicator.locked {
            border-color: #fbbf24; color: #fbbf24; box-shadow: 0 0 15px rgba(251, 191, 36, 0.35);
        }
        #hint-bar {
            position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 5px 16px; border-radius: 20px; font-size: 11px; color: var(--text-muted);
            z-index: 60; pointer-events: none;
        }
    </style>
</head>

 1.2, "curveness": 0.12}}, {"source": "graphify_extract_get_extractor", "target": "graphify_mcp_ingest_extract_mcp_config", "relation": "indirect_call", "confidence": "INFERRED", "lineStyle": {"color": "rgba(56, 189, 248, 0.35)", "width": 1.2, "curveness": 0.12}}, {"source": "graphify_extract_get_extractor", "target": "graphify_extractors_objc_extract_objc", "relation": "indirect_call", "confidence": "INFERRED", "lineStyle": {"color": "rgba(56, 189, 248, 0.35)", "width": 1.2, "curveness": 0.12}}, {"source": "graphify_extract_get_extractor", "target": "graphify_extract_extract_cpp", "relation": "indirect_call", "confidence": "INFERRED", "lineStyle": {"color": "rgba(56, 189, 248, 0.35)", "width": 1.2, "curveness": 0.12}}, {"source": "graphify_build_build_from_json", "target": "pipeline_preflight", "lineStyle": {"color": "#38bdf8", "width": 2, "curveness": 0}}, {"source": "pipeline_preflight", "target": "pipeline_ghost", "lineStyle": {"color": "#38bdf8", "width": 2, "curveness": 0}}, {"source": "pipeline_ghost", "target": "pipeline_assembler", "lineStyle": {"color": "#38bdf8", "width": 2, "curveness": 0}}];

        let chartBefore = null;
        let chartAfter = null;

        // 统一物理视口状态：center 百分比与当前缩放倍率
        let currentCenter = ['50%', '50%'];
        let currentZoom = 1.0;

        function initCharts() {
            chartBefore = echarts.init(document.getElementById('chart-before'));
            chartAfter = echarts.init(document.getElementById('chart-after'));

            const optionBefore = {
                backgroundColor: '#080c14',
                animation: false, // 禁用动画，保证拖拽 0 延迟！
                tooltip: {
                    trigger: 'item',
                    backgroundColor: 'rgba(15, 23, 42, 0.95)',
                    borderColor: '#334155',
                    textStyle: { color: '#f8fafc', fontSize: 12 },
                    formatter: function(params) {
                        if (params.dataType === 'edge') return `调用链路: ${params.data.source} → ${params.data.target}`;
                        return `<b>${params.data.name}</b><br>拓扑连接度: ${params.data.value || params.data.degree} 度`;
                    }
                },
                series: [{
                    type: 'graph',
                    layout: 'none',
                    center: ['50%', '50%'],
                    zoom: 1.0,
                    data: NODES_BEFORE,
                    links: LINKS_BEFORE,
                    roam: false, // 禁用内部独立漫游，交由最外层统一瞬时调度！
                    label: { show: true, position: 'right', color: '#fca5a5', fontSize: 10 },
                    edgeSymbol: ['none', 'arrow'],
                    edgeSymbolSize: [0, 6],
                    lineStyle: { curveness: 0.12 }
                }]
            };

            const optionAfter = {
                backgroundColor: '#080c14',
                animation: false, // 禁用动画，保证拖拽 0 延迟！
                tooltip: {
                    trigger: 'item',
                    backgroundColor: 'rgba(15, 23, 42, 0.95)',
                    borderColor: '#334155',
                    textStyle: { color: '#f8fafc', fontSize: 12 },
                    formatter: function(params) {
                        if (params.dataType === 'edge') return `调用链路: ${params.data.source} → ${params.data.target}`;
                        return `<b>${params.data.name}</b><br>拓扑连接度: ${params.data.value || params.data.degree} 度`;
                    }
                },
                series: [{
                    type: 'graph',
                    layout: 'none',
                    center: ['50%', '50%'],
                    zoom: 1.0,
                    data: NODES_AFTER,
                    links: LINKS_AFTER,
                    roam: false, // 禁用内部独立漫游，交由最外层统一瞬时调度！
                    label: { show: true, position: 'right', color: '#6ee7b7', fontSize: 10 },
                    edgeSymbol: ['none', 'arrow'],
                    edgeSymbolSize: [0, 6],
                    lineStyle: { curveness: 0.12 }
                }]
            };

            chartBefore.setOption(optionBefore);
            chartAfter.setOption(optionAfter);

            window.addEventListener('resize', () => {
                chartBefore.resize();
                chartAfter.resize();
            });
        }

        // 统一调度引擎：以 60 FPS 瞬时同步双画布的平移与缩放（0 延迟、完全同频！）
        function syncBothCharts(center, zoom) {
            currentCenter = center;
            currentZoom = zoom;

            // 两个图表同时同步更新，使用 setOption batch，绝对同一帧落地！
            chartBefore.setOption({
                series: [{ center: center, zoom: zoom }]
            });
            chartAfter.setOption({
                series: [{ center: center, zoom: zoom }]
            });
        }

        // 激光卷帘与鼠标交互控制器
        function initCurtainSwipe() {
            const wrapper = document.getElementById('viewport-wrapper');
            const chartAfterEl = document.getElementById('chart-after');
            const laserLine = document.getElementById('laser-line');
            const lockIndicator = document.getElementById('lock-indicator');

            let isLocked = false;
            let lockedClientX = 0;

            // 拖拽与点击判定状态
            let isMouseDown = false;
            let hasMovedSignificantly = false;
            let startClientX = 0;
            let startClientY = 0;

            // 物理像素偏移量累加器
            let pixelOffsetX = 0;
            let pixelOffsetY = 0;

            function updateCurtain(clientX) {
                const rect = wrapper.getBoundingClientRect();
                const xInWrapper = clientX - rect.left;
                const pct = Math.max(0, Math.min(100, (xInWrapper / rect.width) * 100));

                laserLine.style.left = `${pct}%`;
                chartAfterEl.style.clipPath = `polygon(${pct}% 0, 100% 0, 100% 100%, ${pct}% 100%)`;
            }

            // 1. 鼠标移动：未锁定时滑动画卷；按住时无论锁不锁定都可以自由拖动画布！
            wrapper.addEventListener('mousemove', function(e) {
                if (isMouseDown) {
                    const dx = e.clientX - startClientX;
                    const dy = e.clientY - startClientY;
                    if (Math.hypot(dx, dy) > 4) {
                        hasMovedSignificantly = true;
                        wrapper.classList.add('dragging');
                    }

                    // 实时将像素偏移转为中心百分比位移
                    const rect = wrapper.getBoundingClientRect();
                    const newCenter = [
                        (rect.width * 0.5 + pixelOffsetX + dx),
                        (rect.height * 0.5 + pixelOffsetY + dy)
                    ];
                    syncBothCharts(newCenter, currentZoom);
                }

                // 未锁定时，激光卷帘随时跟随光标漫游
                if (!isLocked) {
                    updateCurtain(e.clientX);
                }
            });

            // 2. 鼠标按下：开始记录拖拽起点
            wrapper.addEventListener('mousedown', function(e) {
                if (e.button === 0 || e.button === 1) {
                    isMouseDown = true;
                    hasMovedSignificantly = false;
                    startClientX = e.clientX;
                    startClientY = e.clientY;
                }
            });

            // 3. 鼠标抬起：判定是“长按拖拽”还是“短按单击”
            window.addEventListener('mouseup', function(e) {
                if (isMouseDown) {
                    isMouseDown = false;
                    wrapper.classList.remove('dragging');

                    if (hasMovedSignificantly) {
                        // 说明是拖拽平移：提交位移累加，不触发锁定切换！
                        const dx = e.clientX - startClientX;
                        const dy = e.clientY - startClientY;
                        pixelOffsetX += dx;
                        pixelOffsetY += dy;
                    } else {
                        // 说明是短按点击单击：切换锁定/解锁状态！
                        if (e.button === 0 && wrapper.contains(e.target)) {
                            isLocked = !isLocked;
                            lockedClientX = e.clientX;

                            if (isLocked) {
                                laserLine.classList.add('locked');
                                lockIndicator.classList.add('locked');
                                lockIndicator.innerHTML = '🔒 画卷已定格 · 光标可自由移出画卷悬停查阅节点函数名 · 再次单击解除';
                                updateCurtain(lockedClientX);
                            } else {
                                laserLine.classList.remove('locked');
                                lockIndicator.classList.remove('locked');
                                lockIndicator.innerHTML = '🔓 卷帘漫游中 · 任意长按拖动画布 · 单击鼠标左键锁定位置自由悬停节点';
                                updateCurtain(e.clientX);
                            }
                        }
                    }
                }
            });

            // 4. 滚轮统一同心缩放
            wrapper.addEventListener('wheel', function(e) {
                e.preventDefault();
                const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
                const newZoom = Math.max(0.2, Math.min(6.0, currentZoom * zoomFactor));
                syncBothCharts(currentCenter, newZoom);
            }, { passive: false });

            // 初始应用 50% 居中分割与自适应居中对齐
            const rect = wrapper.getBoundingClientRect();
            updateCurtain(rect.left + rect.width * 0.5);
            syncBothCharts([rect.width * 0.5, rect.height * 0.5], 1.0);
        }

        window.onload = function() {
            initCharts();
            setTimeout(initCurtainSwipe, 50);
        };
    </script>
