        :root {
            --bg-color: #080c14;
            --panel-bg: rgba(15, 23, 42, 0.94);

            --accent-red: #ef4444;
            --accent-green: #34d399;
            --laser-glow: #38bdf8;
            --text-main: #f8fafc;

        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body {
            background: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            user-select: none;
        }
        header {
            height: 60px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .badge-comfy {
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: #fff; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 4px;
        }
        .title { font-size: 16px; font-weight: 700; }
        .scoreboard {
            display: flex; align-items: center; gap: 16px; background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08); padding: 5px 16px; border-radius: 20px; font-size: 12px;
        }
        .score-val-old { color: #f87171; text-decoration: line-through; }
        .score-val-new { color: #34d399; font-weight: 800; }

        #viewport-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        #viewport-wrapper.dragging {
            cursor: grabbing;
        }

        #main-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: block;
        }

        .floating-label {
            position: absolute; top: 20px; padding: 6px 14px; border-radius: 16px;
            font-size: 12px; font-weight: 700; z-index: 60; pointer-events: none;
        }
        #label-before {
            left: 24px; background: rgba(239, 68, 68, 0.2); border: 1px solid var(--accent-red); color: #fca5a5;
        }
        #label-after {
            right: 24px; background: rgba(16, 185, 129, 0.2); border: 1px solid var(--accent-green); color: #6ee7b7;
        }
        #lock-indicator {
            position: absolute; top: 75px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.92); border: 1px solid #38bdf8; padding: 5px 16px;
            border-radius: 20px; font-size: 12px; font-weight: 600; color: #38bdf8; z-index: 70;
            pointer-events: none; transition: all 0.2s;
        }
        #lock-indicator.locked {
            border-color: #fbbf24; color: #fbbf24; box-shadow: 0 0 15px rgba(251, 191, 36, 0.35);
        }
        #hint-bar {
            position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 5px 16px; border-radius: 20px; font-size: 11px; color: var(--text-muted);
            z-index: 60; pointer-events: none;
        }

        #node-tooltip {
            position: absolute;
            display: none;
            background: rgba(15, 23, 42, 0.96);
            border: 1px solid #38bdf8;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            color: #fff;
            pointer-events: none;
            z-index: 120;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            line-height: 1.5;
        }
    </style>

_extract_extract_csharp", "is_hot": false}, {"source": "graphify_extract", "target": "graphify_extract_extract_php", "is_hot": false}, {"source": "graphify_extract", "target": "graphify_extract_extract_swift", "is_hot": false}, {"source": "graphify_extract", "target": "graphify_extractors_powershell_extract_powershell", "is_hot": false}, {"source": "graphify_extract", "target": "graphify_extractors_elixir_extract_elixir", "is_hot": false}, {"source": "graphify_extract", "target": "graphify_extractors_objc_extract_objc", "is_hot": false}, {"source": "graphify_extract", "target": "graphify_extractors_julia_extract_julia", "is_hot": false}, {"source": "graphify_extract", "target": "graphify_extractors_fortran_extract_fortran", "is_hot": false}, {"source": "graphify_extract", "target": "graphify_extractors_dart_extract_dart", "is_hot": false}, {"source": "graphify_extract", "target": "graphify_extractors_ocaml_extract_ocaml", "is_hot": false}, {"source": "graphify_extract", "target": "graphify_extractors_commonlisp_extract_commonlisp", "is_hot": false}, {"source": "graphify_extract", "target": "graphify_extractors_verilog_extract_verilog", "is_hot": false}, {"source": "graphify_extract", "target": "graphify_extractors_sql_extract_sql", "is_hot": false}, {"source": "graphify_extract", "target": "graphify_extractors_markdown_extract_markdown", "is_hot": false}, {"source": "graphify_extract", "target": "graphify_extractors_pascal_extract_pascal", "is_hot": false}, {"source": "graphify_extract", "target": "graphify_extractors_bash_extract_bash", "is_hot": false}, {"source": "graphify_extract", "target": "graphify_extractors_json_config_extract_json", "is_hot": false}, {"source": "graphify_extract", "target": "graphify_extractors_terraform_extract_terraform", "is_hot": false}, {"source": "graphify_extract", "target": "graphify_extractors_dm_extract_dm", "is_hot": false}, {"source": "graphify_extract", "target": "graphify_extract_extract_xaml", "is_hot": false}, {"source": "graphify_extract", "target": "graphify_extractors_robot_extract_robot", "is_hot": false}, {"source": "graphify_extract", "target": "graphify_extractors_apex_extract_apex", "is_hot": false}, {"source": "graphify_extract_get_extractor", "target": "graphify_mcp_ingest_extract_mcp_config", "is_hot": false}, {"source": "graphify_extract_get_extractor", "target": "graphify_extractors_objc_extract_objc", "is_hot": false}, {"source": "graphify_extract_get_extractor", "target": "graphify_extract_extract_cpp", "is_hot": false}, {"source": "graphify_build_build_from_json", "target": "pipeline_preflight", "is_pipe": true}, {"source": "pipeline_preflight", "target": "pipeline_ghost", "is_pipe": true}, {"source": "pipeline_ghost", "target": "pipeline_assembler", "is_pipe": true}];

        const mapBefore = new Map(NODES_BEFORE.map(n => [n.id, n]));
        const mapAfter = new Map(NODES_AFTER.map(n => [n.id, n]));

        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('viewport-wrapper');
        const tooltip = document.getElementById('node-tooltip');
        const lockIndicator = document.getElementById('lock-indicator');

        // 统一物理视口状态：原点(0,0)天然就是屏幕绝对正中央！
        let cameraX = 0;
        let cameraY = 0;
        let cameraZoom = 1.0;

        let curtainSplitX = 0;
        let isLocked = false;
        let lockedX = 0;

        let isMouseDown = false;
        let hasMoved = false;
        let startMouseX = 0;
        let startMouseY = 0;
        let lastMouseX = 0;
        let lastMouseY = 0;

        let hoveredNode = null;

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = wrapper.clientWidth * dpr;
            canvas.height = wrapper.clientHeight * dpr;
            canvas.style.width = wrapper.clientWidth + 'px';
            canvas.style.height = wrapper.clientHeight + 'px';
            ctx.scale(dpr, dpr);
            if (!curtainSplitX) {
                curtainSplitX = wrapper.clientWidth * 0.5;
                lockedX = curtainSplitX;
            }
            render();
        }

        function render() {
            const W = wrapper.clientWidth;
            const H = wrapper.clientHeight;
            const centerX = W * 0.5 + cameraX;
            const centerY = H * 0.5 + cameraY;

            ctx.clearRect(0, 0, W, H);

            // 1. 绘制左半侧：Before (改造前)
            ctx.save();
            ctx.beginPath();
            ctx.rect(0, 0, curtainSplitX, H);
            ctx.clip();
            drawGraph(NODES_BEFORE, LINKS_BEFORE, mapBefore, centerX, centerY, cameraZoom, true);
            ctx.restore();

            // 2. 绘制右半侧：After (改造后)
            ctx.save();
            ctx.beginPath();
            ctx.rect(curtainSplitX, 0, W - curtainSplitX, H);
            ctx.clip();
            drawGraph(NODES_AFTER, LINKS_AFTER, mapAfter, centerX, centerY, cameraZoom, false);
            ctx.restore();

            // 3. 绘制垂直激光分割轴
            drawLaser(curtainSplitX, H, isLocked);
        }

        function drawGraph(nodes, links, nodeMap, cx, cy, zoom, isBefore) {
            // 1. 绘制纯净无箭头的端点微弧度连线 (彻底对齐 ECharts 优雅质感！)
            for (const l of links) {
                const s = nodeMap.get(l.source);
                const t = nodeMap.get(l.target);
                if (!s || !t) continue;

                const sx = cx + s.x * zoom;
                const sy = cy + s.y * zoom;
                const tx = cx + t.x * zoom;
                const ty = cy + t.y * zoom;

                ctx.beginPath();
                ctx.moveTo(sx, sy);
                // 使用二次贝塞尔曲线产生 ECharts 0.12 同款优雅微弧度！
                const midX = (sx + tx) * 0.5 - (ty - sy) * 0.08;
                const midY = (sy + ty) * 0.5 + (tx - sx) * 0.08;
                ctx.quadraticCurveTo(midX, midY, tx, ty);

                if (l.is_hot) {
                    ctx.strokeStyle = 'rgba(239, 68, 68, 0.65)';
                    ctx.lineWidth = 1.8;
                } else if (l.is_pipe) {
                    ctx.strokeStyle = 'rgba(56, 189, 248, 0.85)';
                    ctx.lineWidth = 1.8;
                } else {
                    ctx.strokeStyle = 'rgba(56, 189, 248, 0.22)';
                    ctx.lineWidth = 1.0;
                }
                ctx.stroke();
            }

            // 2. 绘制立体分层小球 (完全复刻 ECharts 截图：内部色 + 外围发光立体描边环！)
            for (const n of nodes) {
                const nx = cx + n.x * zoom;
                const ny = cy + n.y * zoom;
                const nr = Math.max(5.0, n.r * Math.pow(zoom, 0.7));

                // A. 外层柔和霓虹发光晕
                ctx.save();
                if (n.is_mal) {
                    ctx.shadowColor = 'rgba(239, 68, 68, 0.95)';
                    ctx.shadowBlur = 24;
                } else if (n.name && n.name.includes('[🟢健康门面]')) {
                    ctx.shadowColor = 'rgba(52, 211, 153, 0.85)';
                    ctx.shadowBlur = 18;
                } else {
                    ctx.shadowColor = 'rgba(56, 189, 248, 0.35)';
                    ctx.shadowBlur = 10;
                }

                // B. 外围光环描边 (截图里那一圈高亮有质感的环！)
                ctx.beginPath();
                ctx.arc(nx, ny, nr, 0, Math.PI * 2);
                ctx.fillStyle = n.ringColor || '#ffffff';
                ctx.fill();
                ctx.restore();

                // C. 核心内胆球体 (中间有独立颜色，形成绝美分层立体感！)
                const innerR = Math.max(3.5, nr - 2.8);
                ctx.beginPath();
                ctx.arc(nx, ny, innerR, 0, Math.PI * 2);
                ctx.fillStyle = n.innerColor;
                ctx.fill();

                // 3. 文字颜色严格区分：Before 用粉红，After 用清新绿！
                const isProminent = n.is_mal || (n.name && (n.name.includes('[🟢健康门面]') || n.id.startsWith('pipeline_'))) || n.deg >= 130;
                if (isProminent || (hoveredNode && hoveredNode.id === n.id)) {
                    ctx.font = `${n.is_mal ? 'bold 11px' : '10px'} -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
                    // 彻底对齐：Before 改造前的文字是红色/粉红，After 改造后的文字是淡绿！
                    ctx.fillStyle = isBefore ? '#fca5a5' : '#6ee7b7';
                    ctx.fillText(n.name, nx + nr + 6, ny + 4);
                }
            }
        }

        function drawLaser(x, H, locked) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, H);
            ctx.strokeStyle = locked ? '#fbbf24' : '#38bdf8';
            ctx.lineWidth = 2.5;
            ctx.shadowColor = locked ? '#fbbf24' : '#38bdf8';
            ctx.shadowBlur = 18;
            ctx.stroke();

            const my = H * 0.5;
            ctx.save();
            ctx.translate(x, my);
            ctx.rotate(Math.PI / 4);
            ctx.fillStyle = '#0f172a';
            ctx.strokeStyle = locked ? '#fbbf24' : '#38bdf8';
            ctx.lineWidth = 2;
            ctx.fillRect(-12, -12, 24, 24);
            ctx.strokeRect(-12, -12, 24, 24);
            ctx.restore();

            ctx.restore();
        }

        // 统一交互事件
        wrapper.addEventListener('mousemove', function(e) {
            const rect = wrapper.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (isMouseDown) {
                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;
                if (Math.hypot(e.clientX - startMouseX, e.clientY - startMouseY) > 3) {
                    hasMoved = true;
                    wrapper.classList.add('dragging');
                }
                cameraX += dx;
                cameraY += dy;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                render();
            }

            if (!isLocked) {
                curtainSplitX = mouseX;
                render();
            }

            checkNodeHover(mouseX, mouseY);
        });

        wrapper.addEventListener('mousedown', function(e) {
            if (e.button === 0 || e.button === 1 || e.button === 2) {
                isMouseDown = true;
                hasMoved = false;
                startMouseX = e.clientX;
                startMouseY = e.clientY;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });

        window.addEventListener('mouseup', function(e) {
            if (isMouseDown) {
                isMouseDown = false;
                wrapper.classList.remove('dragging');

                if (!hasMoved && e.button === 0 && wrapper.contains(e.target)) {
                    isLocked = !isLocked;
                    const rect = wrapper.getBoundingClientRect();
                    lockedX = e.clientX - rect.left;

                    if (isLocked) {
                        lockIndicator.classList.add('locked');
                        lockIndicator.innerHTML = '🔒 画卷已定格 · 光标可自由移出画卷悬停查阅节点函数名 · 再次单击解除';
                        curtainSplitX = lockedX;
                    } else {
                        lockIndicator.classList.remove('locked');
                        lockIndicator.innerHTML = '🔓 卷帘漫游中 · 任意长按拖动画布 · 单击鼠标左键锁定位置自由悬停节点';
                        curtainSplitX = e.clientX - rect.left;
                    }
                    render();
                }
            }
        });

        wrapper.addEventListener('wheel', function(e) {
            e.preventDefault();
            const rect = wrapper.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
            const newZoom = Math.max(0.15, Math.min(8.0, cameraZoom * zoomFactor));

            const W = wrapper.clientWidth;
            const H = wrapper.clientHeight;
            const oldCenterX = W * 0.5 + cameraX;
            const oldCenterY = H * 0.5 + cameraY;

            cameraX = mouseX - W * 0.5 - (mouseX - oldCenterX) * (newZoom / cameraZoom);
            cameraY = mouseY - H * 0.5 - (mouseY - oldCenterY) * (newZoom / cameraZoom);
            cameraZoom = newZoom;

            render();
            checkNodeHover(mouseX, mouseY);
        }, { passive: false });

        function checkNodeHover(mx, my) {
            const W = wrapper.clientWidth;
            const H = wrapper.clientHeight;
            const cx = W * 0.5 + cameraX;
            const cy = H * 0.5 + cameraY;

            const activeNodes = (mx < curtainSplitX) ? NODES_BEFORE : NODES_AFTER;
            let found = null;

            for (const n of activeNodes) {
                const nx = cx + n.x * cameraZoom;
                const ny = cy + n.y * cameraZoom;
                const nr = Math.max(5.0, n.r * Math.pow(cameraZoom, 0.7));
                if (Math.hypot(mx - nx, my - ny) <= nr + 5) {
                    found = n;
                    break;
                }
            }

            if (found) {
                tooltip.style.display = 'block';
                tooltip.style.left = (mx + 16) + 'px';
                tooltip.style.top = (my + 16) + 'px';
                const malBadge = found.is_mal ? '<span style="color:#ef4444;font-weight:bold;">🚨 恶性上帝类</span><br>' : '';
                tooltip.innerHTML = `<b>${found.name}</b><br>${malBadge}连接度: ${found.deg} 度`;
            } else {
                tooltip.style.display = 'none';
            }
        }

        window.onload = function() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        };
    </script>
