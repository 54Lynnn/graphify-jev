<html lang="zh-CN">
<head>

    <style>
        :root {
            --bg-color: #080c14;
            --panel-bg: rgba(13, 17, 23, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-subtle: rgba(255, 255, 255, 0.05);
            --accent-cyan: #38bdf8;
            --accent-red: #ef4444;
            --accent-green: #34d399;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --font-sans: -apple-system, BlinkMacSystemFont, "Geist", "Inter", "SF Pro Text", -apple-system, "Segoe UI", Roboto, sans-serif;
            --font-mono: "Geist Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body {
            background: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            user-select: none;
        }
        header {
            height: 52px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .badge-comfy {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 6px;
            padding: 3px 8px;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
        }
        .badge-comfy .pulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 6px rgba(52, 211, 153, 0.6);
        }
        .title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }
        .title-brand {
            font-weight: 600;
            color: #f8fafc;
            letter-spacing: -0.01em;
        }
        .title-sep {
            color: #475569;
            font-weight: 400;
        }
        .title-sub {
            color: var(--text-secondary);
            font-weight: 400;
        }
        .scoreboard {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: nowrap;
            flex-shrink: 0;
        }
        .metric-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 4px 12px;
            font-size: 12px;
            white-space: nowrap;
            flex-shrink: 0;
            transition: border-color 0.15s ease;
        }
        .metric-pill:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }
        .metric-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .dot-emerald {
            background: #34d399;
            box-shadow: 0 0 5px rgba(52, 211, 153, 0.6);
        }
        .dot-cyan {
            background: #38bdf8;
            box-shadow: 0 0 5px rgba(56, 189, 248, 0.6);
        }
        .metric-label {
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.02em;
        }
        .metric-val {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-family: var(--font-mono);
            font-size: 12px;
        }
        .score-val-old {
            color: var(--text-muted);
            text-decoration: line-through;
            opacity: 0.8;
            font-weight: 400;
        }
        .score-arrow {
            color: #475569;
            font-size: 10px;
        }
        .score-val-new {
            color: #34d399;
            font-weight: 600;
        }
        .metric-badge-rating {
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.25);
            color: #34d399;
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 4px;
        }

        #viewport-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 100%;
            cursor: grab;
            background: radial-gradient(circle at 50% 50%, #0d1527 0%, #060911 100%);
        }
        #viewport-wrapper.dragging {
            cursor: grabbing;
        }

        #main-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .floating-label {
            position: absolute;
            top: 16px;
            z-index: 60;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding: 8px 14px;
            border-radius: 8px;
            background: rgba(10, 14, 23, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        #label-before {
            left: 16px;
        }
        #label-after {
            right: 16px;
            align-items: flex-end;
        }
        .label-head {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tag-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        .dot-red {
            background: #f87171;
            box-shadow: 0 0 6px rgba(248, 113, 113, 0.6);
        }
        .dot-green {
            background: #34d399;
            box-shadow: 0 0 6px rgba(52, 211, 153, 0.6);
        }
        .label-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
            font-family: var(--font-mono);
            text-transform: uppercase;
        }
        #label-before .label-title { color: #fca5a5; }
        #label-after .label-title { color: #6ee7b7; }
        .label-desc {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        #lock-indicator {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 14, 23, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            padding: 0 12px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            z-index: 70;
            pointer-events: none;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }
        #lock-indicator .indicator-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-cyan);
            box-shadow: 0 0 6px rgba(56, 189, 248, 0.6);
            transition: all 0.2s ease;
        }
        #lock-indicator.locked {
            border-color: rgba(245, 158, 11, 0.4);
            background: rgba(20, 16, 10, 0.85);
            color: #fbbf24;
            box-shadow: 0 4px 18px rgba(245, 158, 11, 0.18);
        }
        #lock-indicator.locked .indicator-dot {
            background: #fbbf24;
            box-shadow: 0 0 8px rgba(251, 191, 36, 0.8);
        }

        #hint-bar {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 14, 23, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            color: var(--text-secondary);
            z-index: 60;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        #hint-bar kbd {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            padding: 1px 5px;
            font-family: var(--font-mono);
            font-size: 10px;
            color: #e2e8f0;
        }
        .hint-sep {
            color: #475569;
            font-size: 10px;
        }

        #node-tooltip {
            position: absolute;
            display: none;
            background: rgba(9, 13, 22, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            border-radius: 8px;
            font-size: 12px;

            line-height: 1.5;
            min-width: 170px;
        }
    </style>

raphify_extract", "target": "graphify_extractors_robot_extract_robot", "is_hot": false}, {"source": "graphify_extract", "target": "graphify_extractors_apex_extract_apex", "is_hot": false}, {"source": "graphify_extract_get_extractor", "target": "graphify_mcp_ingest_extract_mcp_config", "is_hot": false}, {"source": "graphify_extract_get_extractor", "target": "graphify_extractors_objc_extract_objc", "is_hot": false}, {"source": "graphify_extract_get_extractor", "target": "graphify_extract_extract_cpp", "is_hot": false}, {"source": "graphify_build_build_from_json", "target": "pipeline_preflight", "is_pipe": true}, {"source": "pipeline_preflight", "target": "pipeline_ghost", "is_pipe": true}, {"source": "pipeline_ghost", "target": "pipeline_assembler", "is_pipe": true}];

        const mapBefore = new Map(NODES_BEFORE.map(n => [n.id, n]));
        const mapAfter = new Map(NODES_AFTER.map(n => [n.id, n]));

        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('viewport-wrapper');
        const tooltip = document.getElementById('node-tooltip');
        const lockIndicator = document.getElementById('lock-indicator');

        // 统一物理视口状态：原点(0,0)天然就是屏幕绝对正中央！
        let cameraX = 0;
        let cameraY = 0;
        let cameraZoom = 1.0;

        let curtainSplitX = 0;
        let isLocked = false;
        let lockedX = 0;

        let isMouseDown = false;
        let hasMoved = false;
        let startMouseX = 0;
        let startMouseY = 0;
        let lastMouseX = 0;
        let lastMouseY = 0;

        let hoveredNode = null;

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = wrapper.clientWidth * dpr;
            canvas.height = wrapper.clientHeight * dpr;
            canvas.style.width = wrapper.clientWidth + 'px';
            canvas.style.height = wrapper.clientHeight + 'px';
            ctx.scale(dpr, dpr);
            if (!curtainSplitX) {
                curtainSplitX = wrapper.clientWidth * 0.5;
                lockedX = curtainSplitX;
            }
            render();
        }

        function render() {
            const W = wrapper.clientWidth;
            const H = wrapper.clientHeight;
            const centerX = W * 0.5 + cameraX;
            const centerY = H * 0.5 + cameraY;

            ctx.clearRect(0, 0, W, H);

            // 1. 绘制左半侧：Before (改造前)
            ctx.save();
            ctx.beginPath();
            ctx.rect(0, 0, curtainSplitX, H);
            ctx.clip();
            drawGraph(NODES_BEFORE, LINKS_BEFORE, mapBefore, centerX, centerY, cameraZoom, true);
            ctx.restore();

            // 2. 绘制右半侧：After (改造后)
            ctx.save();
            ctx.beginPath();
            ctx.rect(curtainSplitX, 0, W - curtainSplitX, H);
            ctx.clip();
            drawGraph(NODES_AFTER, LINKS_AFTER, mapAfter, centerX, centerY, cameraZoom, false);
            ctx.restore();

            // 3. 绘制垂直激光分割轴
            drawLaser(curtainSplitX, H, isLocked);
        }

        function drawGraph(nodes, links, nodeMap, cx, cy, zoom, isBefore) {
            // 1. 绘制纯净无箭头的端点微弧度连线 (二次贝塞尔曲线 0.12 微弧度)
            for (const l of links) {
                const s = nodeMap.get(l.source);
                const t = nodeMap.get(l.target);
                if (!s || !t) continue;

                const sx = cx + s.x * zoom;
                const sy = cy + s.y * zoom;
                const tx = cx + t.x * zoom;
                const ty = cy + t.y * zoom;

                ctx.beginPath();
                ctx.moveTo(sx, sy);
                const midX = (sx + tx) * 0.5 - (ty - sy) * 0.08;
                const midY = (sy + ty) * 0.5 + (tx - sx) * 0.08;
                ctx.quadraticCurveTo(midX, midY, tx, ty);

                if (l.is_hot) {
                    ctx.strokeStyle = 'rgba(239, 68, 68, 0.65)';
                    ctx.lineWidth = 1.8;
                } else if (l.is_pipe) {
                    ctx.strokeStyle = 'rgba(56, 189, 248, 0.85)';
                    ctx.lineWidth = 1.8;
                } else {
                    ctx.strokeStyle = 'rgba(56, 189, 248, 0.22)';
                    ctx.lineWidth = 1.0;
                }
                ctx.stroke();
            }

            // 2. 绘制立体分层小球 (黄金尺寸 + 间距呼吸感 + 100% 全量展示函数名)
            for (const n of nodes) {
                const nx = cx + n.x * zoom;
                const ny = cy + n.y * zoom;

                let baseR = n.is_mal ? 15 : (n.name && n.name.includes('[🟢健康门面]') ? 10 : (n.id && n.id.startsWith('pipeline_') ? 8 : Math.max(5.2, Math.min(8.0, n.deg * 0.04 + 4.8))));
                const nr = Math.max(4.0, baseR * Math.pow(zoom, 0.65));

                // A. 外层柔和霓虹发光晕
                ctx.save();
                if (n.is_mal) {
                    ctx.shadowColor = 'rgba(239, 68, 68, 0.95)';
                    ctx.shadowBlur = 20;
                } else if (n.name && n.name.includes('[🟢健康门面]')) {
                    ctx.shadowColor = 'rgba(52, 211, 153, 0.85)';
                    ctx.shadowBlur = 15;
                } else {
                    ctx.shadowColor = 'rgba(56, 189, 248, 0.25)';
                    ctx.shadowBlur = 8;
                }

                // B. 外围光环描边 (高亮有层次的双层立体环)
                ctx.beginPath();
                ctx.arc(nx, ny, nr, 0, Math.PI * 2);
                ctx.fillStyle = n.ringColor || '#ffffff';
                ctx.fill();
                ctx.restore();

                // C. 核心内胆球体 (中间有独立颜色，外圈裹光环)
                const innerR = Math.max(2.8, nr - 2.0);
                ctx.beginPath();
                ctx.arc(nx, ny, innerR, 0, Math.PI * 2);
                ctx.fillStyle = n.innerColor;
                ctx.fill();

                // 3. 所有节点 100% 全部展示函数名称与类名
                ctx.font = `${n.is_mal ? 'bold 11px' : '9.5px'} "Geist Mono", "JetBrains Mono", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
                ctx.fillStyle = isBefore ? '#fca5a5' : '#6ee7b7';
                ctx.fillText(n.name, nx + nr + 4, ny + 3.5);
            }
        }

        function drawLaser(x, H, locked) {
            ctx.save();
            const color = locked ? 'rgba(245, 158, 11, 0.85)' : 'rgba(56, 189, 248, 0.75)';
            const glowColor = locked ? 'rgba(245, 158, 11, 0.4)' : 'rgba(56, 189, 248, 0.35)';

            // 1. 极简精密 1px 细线 + 微弱柔和辉光
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, H);
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.0;
            ctx.shadowColor = glowColor;
            ctx.shadowBlur = locked ? 6 : 4;
            ctx.stroke();

            // 2. 居中垂直胶囊把手 (Figma / ComfyUI 极简精密风格)
            const my = H * 0.5;
            const handleW = 6;
            const handleH = 36;
            const handleR = 3;

            ctx.save();
            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 8;

            ctx.beginPath();
            if (ctx.roundRect) {
                ctx.roundRect(x - handleW * 0.5, my - handleH * 0.5, handleW, handleH, handleR);
            } else {
                ctx.rect(x - handleW * 0.5, my - handleH * 0.5, handleW, handleH);
            }
            ctx.fillStyle = '#090d16';
            ctx.fill();
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.2;
            ctx.stroke();

            // 把手内部微刻度抓手纹理 (两条精密水平微细线)
            ctx.beginPath();
            ctx.moveTo(x - 1.5, my - 3);
            ctx.lineTo(x + 1.5, my - 3);
            ctx.moveTo(x - 1.5, my + 3);
            ctx.lineTo(x + 1.5, my + 3);
            ctx.strokeStyle = locked ? 'rgba(251, 191, 36, 0.7)' : 'rgba(226, 232, 240, 0.6)';
            ctx.lineWidth = 1.0;
            ctx.stroke();
            ctx.restore();

            // 3. 顶部与底部精密刻度指示线
            ctx.beginPath();
            ctx.moveTo(x - 3, 8);
            ctx.lineTo(x + 3, 8);
            ctx.moveTo(x - 3, H - 8);
            ctx.lineTo(x + 3, H - 8);
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.0;
            ctx.stroke();

            ctx.restore();
        }

        // 统一交互事件
        wrapper.addEventListener('mousemove', function(e) {
            const rect = wrapper.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (isMouseDown) {
                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;
                if (Math.hypot(e.clientX - startMouseX, e.clientY - startMouseY) > 3) {
                    hasMoved = true;
                    wrapper.classList.add('dragging');
                }
                cameraX += dx;
                cameraY += dy;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                render();
            }

            if (!isLocked) {
                curtainSplitX = mouseX;
                render();
            }

            checkNodeHover(mouseX, mouseY);
        });

        wrapper.addEventListener('mousedown', function(e) {
            if (e.button === 0 || e.button === 1 || e.button === 2) {
                isMouseDown = true;
                hasMoved = false;
                startMouseX = e.clientX;
                startMouseY = e.clientY;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });

        window.addEventListener('mouseup', function(e) {
            if (isMouseDown) {
                isMouseDown = false;
                wrapper.classList.remove('dragging');

                if (!hasMoved && e.button === 0 && wrapper.contains(e.target)) {
                    isLocked = !isLocked;
                    const rect = wrapper.getBoundingClientRect();
                    lockedX = e.clientX - rect.left;

                    if (isLocked) {
                        lockIndicator.classList.add('locked');
                        lockIndicator.innerHTML = '<span class="indicator-dot"></span><span>画卷已定格 · 自由悬停查阅节点 · 单击解除</span>';
                        curtainSplitX = lockedX;
                    } else {
                        lockIndicator.classList.remove('locked');
                        lockIndicator.innerHTML = '<span class="indicator-dot"></span><span>卷帘跟随中 · 单击画布定格</span>';
                        curtainSplitX = e.clientX - rect.left;
                    }
                    render();
                }
            }
        });

        wrapper.addEventListener('wheel', function(e) {
            e.preventDefault();
            const rect = wrapper.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
            const newZoom = Math.max(0.15, Math.min(8.0, cameraZoom * zoomFactor));

            const W = wrapper.clientWidth;
            const H = wrapper.clientHeight;
            const oldCenterX = W * 0.5 + cameraX;
            const oldCenterY = H * 0.5 + cameraY;

            cameraX = mouseX - W * 0.5 - (mouseX - oldCenterX) * (newZoom / cameraZoom);
            cameraY = mouseY - H * 0.5 - (mouseY - oldCenterY) * (newZoom / cameraZoom);
            cameraZoom = newZoom;

            render();
            checkNodeHover(mouseX, mouseY);
        }, { passive: false });

        function checkNodeHover(mx, my) {
            const W = wrapper.clientWidth;
            const H = wrapper.clientHeight;
            const cx = W * 0.5 + cameraX;
            const cy = H * 0.5 + cameraY;

            const activeNodes = (mx < curtainSplitX) ? NODES_BEFORE : NODES_AFTER;
            let found = null;

            for (const n of activeNodes) {
                const nx = cx + n.x * cameraZoom;
                const ny = cy + n.y * cameraZoom;
                const nr = Math.max(5.0, n.r * Math.pow(cameraZoom, 0.7));
                if (Math.hypot(mx - nx, my - ny) <= nr + 5) {
                    found = n;
                    break;
                }
            }

            if (found) {
                tooltip.style.display = 'block';
                const tipX = Math.min(wrapper.clientWidth - 220, mx + 16);
                const tipY = Math.min(wrapper.clientHeight - 90, my + 16);
                tooltip.style.left = tipX + 'px';
                tooltip.style.top = tipY + 'px';
                const malBadge = found.is_mal
                    ? '<div style="display:inline-flex;align-items:center;gap:4px;color:#f87171;font-size:10px;font-weight:600;background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.25);border-radius:4px;padding:1px 6px;margin-top:4px;">🚨 恶性上帝类</div>'
                    : '';
                tooltip.innerHTML = `
                    <div style="font-family:'Geist Mono',Menlo,monospace;font-size:12px;font-weight:600;color:#f8fafc;word-break:break-all;">${found.name}</div>
                    ${malBadge}
                    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,0.08);font-size:11px;color:#94a3b8;">
                        <span>连接度</span>
                        <span style="font-family:'Geist Mono',Menlo,monospace;font-weight:600;color:#e2e8f0;">${found.deg} 度</span>
                    </div>
                `;
            } else {
                tooltip.style.display = 'none';
            }
        }

        window.onload = function() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            const params = new URLSearchParams(window.location.search);
            if (params.get('test') === 'locked') {
                isLocked = true;
                lockIndicator.classList.add('locked');
                lockIndicator.innerHTML = '<span class="indicator-dot"></span><span>画卷已定格 · 自由悬停查阅节点 · 单击解除</span>';
                render();
            } else if (params.get('test') === 'hover') {
                isLocked = true;
                lockIndicator.classList.add('locked');
                lockIndicator.innerHTML = '<span class="indicator-dot"></span><span>画卷已定格 · 自由悬停查阅节点 · 单击解除</span>';
                render();
                checkNodeHover(wrapper.clientWidth * 0.5, wrapper.clientHeight * 0.5 - 35);
            }
        };
    </script>
</body>
</html>
