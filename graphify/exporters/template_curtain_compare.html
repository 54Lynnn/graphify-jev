    <style>
        :root {
            --bg-color: #080c14;
            --panel-bg: rgba(15, 23, 42, 0.94);
            --border-color: #1e293b;
            --accent-cyan: #38bdf8;
            --accent-red: #ef4444;
            --accent-green: #34d399;
            --laser-glow: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body {
            background: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            user-select: none;
        }
        header {
            height: 60px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .badge-comfy {
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: #fff; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 4px;
        }
        .title { font-size: 16px; font-weight: 700; }
        .scoreboard {
            display: flex; align-items: center; gap: 16px; background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08); padding: 5px 16px; border-radius: 20px; font-size: 12px;
        }
        .score-val-old { color: #f87171; text-decoration: line-through; }
        .score-val-new { color: #34d399; font-weight: 800; }

        #viewport-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        #viewport-wrapper.dragging {
            cursor: grabbing;
        }

        /* 单一真正的超清 Canvas，彻底根除任何多 Canvas 视口脱节！ */
        #main-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: block;
        }

        .floating-label {
            position: absolute; top: 20px; padding: 6px 14px; border-radius: 16px;
            font-size: 12px; font-weight: 700; z-index: 60; pointer-events: none;
        }
        #label-before {
            left: 24px; background: rgba(239, 68, 68, 0.2); border: 1px solid var(--accent-red); color: #fca5a5;
        }
        #label-after {
            right: 24px; background: rgba(16, 185, 129, 0.2); border: 1px solid var(--accent-green); color: #6ee7b7;
        }
        #lock-indicator {
            position: absolute; top: 75px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.92); border: 1px solid #38bdf8; padding: 5px 16px;
            border-radius: 20px; font-size: 12px; font-weight: 600; color: #38bdf8; z-index: 70;
            pointer-events: none; transition: all 0.2s;
        }
        #lock-indicator.locked {
            border-color: #fbbf24; color: #fbbf24; box-shadow: 0 0 15px rgba(251, 191, 36, 0.35);
        }
        #hint-bar {
            position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 5px 16px; border-radius: 20px; font-size: 11px; color: var(--text-muted);
            z-index: 60; pointer-events: none;
        }

        /* 悬停信息气泡 (Tooltip) */
        #node-tooltip {
            position: absolute;
            display: none;
            background: rgba(15, 23, 42, 0.96);
            border: 1px solid #38bdf8;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            color: #fff;
            pointer-events: none;
            z-index: 120;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            line-height: 1.5;
        }
    </style>

raphify_extract", "target": "graphify_extractors_robot_extract_robot", "is_hot": false}, {"source": "graphify_extract", "target": "graphify_extractors_apex_extract_apex", "is_hot": false}, {"source": "graphify_extract_get_extractor", "target": "graphify_mcp_ingest_extract_mcp_config", "is_hot": false}, {"source": "graphify_extract_get_extractor", "target": "graphify_extractors_objc_extract_objc", "is_hot": false}, {"source": "graphify_extract_get_extractor", "target": "graphify_extract_extract_cpp", "is_hot": false}, {"source": "graphify_build_build_from_json", "target": "pipeline_preflight", "is_pipe": true}, {"source": "pipeline_preflight", "target": "pipeline_ghost", "is_pipe": true}, {"source": "pipeline_ghost", "target": "pipeline_assembler", "is_pipe": true}];

        const mapBefore = new Map(NODES_BEFORE.map(n => [n.id, n]));
        const mapAfter = new Map(NODES_AFTER.map(n => [n.id, n]));

        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('viewport-wrapper');
        const tooltip = document.getElementById('node-tooltip');
        const lockIndicator = document.getElementById('lock-indicator');

        // 统一物理视口状态：原点(0,0)天然就是屏幕绝对正中央！
        let cameraX = 0;
        let cameraY = 0;
        let cameraZoom = 1.0;

        let curtainSplitX = 0; // 激光卷帘分割轴像素位置
        let isLocked = false;
        let lockedX = 0;

        let isMouseDown = false;
        let hasMoved = false;
        let startMouseX = 0;
        let startMouseY = 0;
        let lastMouseX = 0;
        let lastMouseY = 0;

        let hoveredNode = null;

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = wrapper.clientWidth * dpr;
            canvas.height = wrapper.clientHeight * dpr;
            canvas.style.width = wrapper.clientWidth + 'px';
            canvas.style.height = wrapper.clientHeight + 'px';
            ctx.scale(dpr, dpr);
            if (!curtainSplitX) {
                curtainSplitX = wrapper.clientWidth * 0.5;
                lockedX = curtainSplitX;
            }
            render();
        }

        // 核心渲染循环：单一画布、双层剪切、绝对同轴！
        function render() {
            const W = wrapper.clientWidth;
            const H = wrapper.clientHeight;
            const centerX = W * 0.5 + cameraX;
            const centerY = H * 0.5 + cameraY;

            ctx.clearRect(0, 0, W, H);

            // 1. 绘制左半侧：改造前 (Before)
            ctx.save();
            ctx.beginPath();
            ctx.rect(0, 0, curtainSplitX, H);
            ctx.clip(); // 物理裁剪左半边！
            drawGraph(NODES_BEFORE, LINKS_BEFORE, mapBefore, centerX, centerY, cameraZoom, true);
            ctx.restore();

            // 2. 绘制右半侧：改造后 (After)
            ctx.save();
            ctx.beginPath();
            ctx.rect(curtainSplitX, 0, W - curtainSplitX, H);
            ctx.clip(); // 物理裁剪右半边！
            drawGraph(NODES_AFTER, LINKS_AFTER, mapAfter, centerX, centerY, cameraZoom, false);
            ctx.restore();

            // 3. 绘制垂直激光分割轴 (Laser Line & Handle)
            drawLaser(curtainSplitX, H, isLocked);
        }

        function drawGraph(nodes, links, nodeMap, cx, cy, zoom, isBefore) {
            // 绘制连线
            for (const l of links) {
                const s = nodeMap.get(l.source);
                const t = nodeMap.get(l.target);
                if (!s || !t) continue;

                const sx = cx + s.x * zoom;
                const sy = cy + s.y * zoom;
                const tx = cx + t.x * zoom;
                const ty = cy + t.y * zoom;

                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(tx, ty);
                ctx.strokeStyle = l.is_hot ? 'rgba(239, 68, 68, 0.7)' : (l.is_pipe ? '#38bdf8' : 'rgba(56, 189, 248, 0.25)');
                ctx.lineWidth = l.is_hot || l.is_pipe ? 2.2 : 1.0;
                ctx.stroke();
            }

            // 绘制节点
            for (const n of nodes) {
                const nx = cx + n.x * zoom;
                const ny = cy + n.y * zoom;
                const nr = Math.max(4, n.r * zoom);

                // 发光阴影
                if (n.is_mal) {
                    ctx.save();
                    ctx.shadowColor = 'rgba(239, 68, 68, 0.9)';
                    ctx.shadowBlur = 24;
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath();
                    ctx.arc(nx, ny, nr, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                ctx.beginPath();
                ctx.arc(nx, ny, nr, 0, Math.PI * 2);
                ctx.fillStyle = n.color;
                ctx.fill();
                ctx.strokeStyle = n.is_mal ? '#ffffff' : '#1e293b';
                ctx.lineWidth = n.is_mal ? 2.5 : 1;
                ctx.stroke();

                // 节点文字标注
                if (n.is_mal || nr > 10 || zoom > 1.2) {
                    ctx.font = `${Math.max(10, Math.min(13, 10 * zoom))}px sans-serif`;
                    ctx.fillStyle = isBefore ? '#fca5a5' : '#cbd5e1';
                    ctx.fillText(n.name, nx + nr + 4, ny + 4);
                }
            }
        }

        function drawLaser(x, H, locked) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, H);
            ctx.strokeStyle = locked ? '#fbbf24' : '#38bdf8';
            ctx.lineWidth = 2.5;
            ctx.shadowColor = locked ? '#fbbf24' : '#38bdf8';
            ctx.shadowBlur = 18;
            ctx.stroke();

            // 菱形把手
            const my = H * 0.5;
            ctx.save();
            ctx.translate(x, my);
            ctx.rotate(Math.PI / 4);
            ctx.fillStyle = '#0f172a';
            ctx.strokeStyle = locked ? '#fbbf24' : '#38bdf8';
            ctx.lineWidth = 2;
            ctx.fillRect(-12, -12, 24, 24);
            ctx.strokeRect(-12, -12, 24, 24);
            ctx.restore();

            ctx.restore();
        }

        // 统一交互事件绑定
        wrapper.addEventListener('mousemove', function(e) {
            const rect = wrapper.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (isMouseDown) {
                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;
                if (Math.hypot(e.clientX - startMouseX, e.clientY - startMouseY) > 3) {
                    hasMoved = true;
                    wrapper.classList.add('dragging');
                }
                // 拖拽平移：视口中心坐标严格同一时间毫秒位移！
                cameraX += dx;
                cameraY += dy;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                render();
            }

            // 未锁定时，激光分割线跟随光标滑动
            if (!isLocked) {
                curtainSplitX = mouseX;
                render();
            }

            // 节点悬停检测 (Hit Testing)
            checkNodeHover(mouseX, mouseY);
        });

        wrapper.addEventListener('mousedown', function(e) {
            if (e.button === 0 || e.button === 1 || e.button === 2) {
                isMouseDown = true;
                hasMoved = false;
                startMouseX = e.clientX;
                startMouseY = e.clientY;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });

        window.addEventListener('mouseup', function(e) {
            if (isMouseDown) {
                isMouseDown = false;
                wrapper.classList.remove('dragging');

                // 短按单击：切换锁定/解锁
                if (!hasMoved && e.button === 0 && wrapper.contains(e.target)) {
                    isLocked = !isLocked;
                    const rect = wrapper.getBoundingClientRect();
                    lockedX = e.clientX - rect.left;

                    if (isLocked) {
                        lockIndicator.classList.add('locked');
                        lockIndicator.innerHTML = '🔒 画卷已定格 · 光标可自由移出画卷悬停查阅节点函数名 · 再次单击解除';
                        curtainSplitX = lockedX;
                    } else {
                        lockIndicator.classList.remove('locked');
                        lockIndicator.innerHTML = '🔓 卷帘漫游中 · 任意长按拖动画布 · 单击鼠标左键锁定位置自由悬停节点';
                        curtainSplitX = e.clientX - rect.left;
                    }
                    render();
                }
            }
        });

        // 统一滚轮缩放 (以鼠标指针为几何绝对锚点缩放！)
        wrapper.addEventListener('wheel', function(e) {
            e.preventDefault();
            const rect = wrapper.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
            const newZoom = Math.max(0.15, Math.min(10.0, cameraZoom * zoomFactor));

            const W = wrapper.clientWidth;
            const H = wrapper.clientHeight;
            const oldCenterX = W * 0.5 + cameraX;
            const oldCenterY = H * 0.5 + cameraY;

            // 保持鼠标下的拓扑点绝对不动 (Anchor Scaling)
            cameraX = mouseX - W * 0.5 - (mouseX - oldCenterX) * (newZoom / cameraZoom);
            cameraY = mouseY - H * 0.5 - (mouseY - oldCenterY) * (newZoom / cameraZoom);
            cameraZoom = newZoom;

            render();
            checkNodeHover(mouseX, mouseY);
        }, { passive: false });

        function checkNodeHover(mx, my) {
            const W = wrapper.clientWidth;
            const H = wrapper.clientHeight;
            const cx = W * 0.5 + cameraX;
            const cy = H * 0.5 + cameraY;

            // 根据鼠标在激光分割线左还是右，拾取对应的图谱节点
            const activeNodes = (mx < curtainSplitX) ? NODES_BEFORE : NODES_AFTER;
            let found = null;

            for (const n of activeNodes) {
                const nx = cx + n.x * cameraZoom;
                const ny = cy + n.y * cameraZoom;
                const nr = Math.max(6, n.r * cameraZoom);
                if (Math.hypot(mx - nx, my - ny) <= nr + 4) {
                    found = n;
                    break;
                }
            }

            if (found) {
                tooltip.style.display = 'block';
                tooltip.style.left = (mx + 16) + 'px';
                tooltip.style.top = (my + 16) + 'px';
                const malBadge = found.is_mal ? '<span style="color:#ef4444;font-weight:bold;">🚨 恶性上帝类</span><br>' : '';
                tooltip.innerHTML = `<b>${found.name}</b><br>${malBadge}连接度: ${found.deg} 度`;
            } else {
                tooltip.style.display = 'none';
            }
        }

        window.onload = function() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        };
