<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphify-Jev 架构解耦前/后纯正 ComfyUI 激光卷帘对比中心 (ECharts 官方原汁原味)</title>
    <!-- 引入 ECharts 5 官方渲染引擎 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        :root {
            --bg-color: #080c14;
            --panel-bg: rgba(15, 23, 42, 0.94);
            --border-color: #1e293b;
            --accent-cyan: #38bdf8;
            --accent-red: #ef4444;
            --accent-green: #34d399;
            --laser-glow: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body {
            background: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            user-select: none;
        }
        header {
            height: 60px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .badge-comfy {
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: #fff; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 4px;
        }
        .title { font-size: 16px; font-weight: 700; }
        .scoreboard {
            display: flex; align-items: center; gap: 16px; background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08); padding: 5px 16px; border-radius: 20px; font-size: 12px;
        }
        .score-val-old { color: #f87171; text-decoration: line-through; }
        .score-val-new { color: #34d399; font-weight: 800; }

        #viewport-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        #viewport-wrapper.dragging {
            cursor: grabbing;
        }

        /* 统一双层画布：均使用 ECharts 原生渲染，彻底找回细腻灵动的球体与纯净无箭头连线 */
        .chart-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        #chart-before {
            z-index: 10;
            background: #080c14;
        }

        #chart-after {
            z-index: 20;
            background: #080c14;
            /* 由 JS 实时通过 clip-path 物理切除 */
        }

        #laser-line {
            position: absolute; top: 0; bottom: 0; width: 2px;
            background: linear-gradient(180deg, #38bdf8, #a855f7, #38bdf8);
            box-shadow: 0 0 16px var(--laser-glow), 0 0 32px rgba(56, 189, 248, 0.7);
            z-index: 50; pointer-events: none;
        }
        #laser-line.locked {
            background: linear-gradient(180deg, #fbbf24, #f59e0b, #fbbf24);
            box-shadow: 0 0 18px #fbbf24, 0 0 35px rgba(251, 191, 36, 0.7);
        }
        #laser-handle {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            width: 24px; height: 24px; background: #0f172a;
            border: 2px solid #38bdf8; box-shadow: 0 0 14px #38bdf8;
        }
        #laser-line.locked #laser-handle {
            border-color: #fbbf24; box-shadow: 0 0 16px #fbbf24;
        }

        .floating-label {
            position: absolute; top: 20px; padding: 6px 14px; border-radius: 16px;
            font-size: 12px; font-weight: 700; z-index: 60; pointer-events: none;
        }
        #label-before {
            left: 24px; background: rgba(239, 68, 68, 0.2); border: 1px solid var(--accent-red); color: #fca5a5;
        }
        #label-after {
            right: 24px; background: rgba(16, 185, 129, 0.2); border: 1px solid var(--accent-green); color: #6ee7b7;
        }
        #lock-indicator {
            position: absolute; top: 75px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.92); border: 1px solid #38bdf8; padding: 5px 16px;
            border-radius: 20px; font-size: 12px; font-weight: 600; color: #38bdf8; z-index: 70;
            pointer-events: none; transition: all 0.2s;
        }
        #lock-indicator.locked {
            border-color: #fbbf24; color: #fbbf24; box-shadow: 0 0 15px rgba(251, 191, 36, 0.35);
        }
        #hint-bar {
            position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 5px 16px; border-radius: 20px; font-size: 11px; color: var(--text-muted);
            z-index: 60; pointer-events: none;
        }
    </style>
</head>

        let chartBefore = null;

        // 全局物理视口矩阵：统一控制用户视角中心！
        // 彻底根除先后移动，两图同时原子改写！
        let currentPanX = 0;
        let currentPanY = 0;
        let currentZoom = 1.0;

        function initCharts() {
            chartBefore = echarts.init(document.getElementById('chart-before'));
            chartAfter = echarts.init(document.getElementById('chart-after'));

            const commonConfig = {
                type: 'graph',
                layout: 'none',

        // 统一视角核心调度器：真正同时改写两张图的视角中心 (Center) 与缩放倍率 (Zoom)
        function updateUnifiedViewport(dx, dy, zoomMultiplier, mouseX, mouseY) {
            const wrapper = document.getElementById('viewport-wrapper');
            const W = wrapper.clientWidth;
            const H = wrapper.clientHeight;

            if (zoomMultiplier) {
                const newZoom = Math.max(0.2, Math.min(6.0, currentZoom * zoomMultiplier));
                // 以鼠标当前光标为几何绝对锚点同步缩放双图！
                currentPanX = mouseX - W * 0.5 - (mouseX - (W * 0.5 + currentPanX)) * (newZoom / currentZoom);
                currentPanY = mouseY - H * 0.5 - (mouseY - (H * 0.5 + currentPanY)) * (newZoom / currentZoom);
                currentZoom = newZoom;
            }

            if (dx !== undefined && dy !== undefined) {
                currentPanX += dx;
                currentPanY += dy;
            }

            const centerPx = [W * 0.5 + currentPanX, H * 0.5 + currentPanY];

                    center: centerPx,
                    zoom: currentZoom
                }]
            };

            chartBefore.setOption(batchUpdate);
            chartAfter.setOption(batchUpdate);
        }

        // 激光卷帘控制器 (带单键点击锁定)
        function initCurtainSwipe() {
            const wrapper = document.getElementById('viewport-wrapper');
            const chartAfterEl = document.getElementById('chart-after');
            const laserLine = document.getElementById('laser-line');
            const lockIndicator = document.getElementById('lock-indicator');

            let isLocked = false;
            let lockedClientX = 0;
            let isMouseDown = false;
            let hasMovedSignificantly = false;
            let lastX = 0;
            let lastY = 0;
            let startX = 0;
            let startY = 0;

            function updateCurtain(clientX) {
                const rect = wrapper.getBoundingClientRect();
                const xInWrapper = clientX - rect.left;
                const pct = Math.max(0, Math.min(100, (xInWrapper / rect.width) * 100));

                laserLine.style.left = `${pct}%`;
                chartAfterEl.style.clipPath = `polygon(${pct}% 0, 100% 0, 100% 100%, ${pct}% 100%)`;
            }

            // 1. 鼠标移动：未锁定时滑动画卷；长按拖动时两张图绝对 100% 同时位移！
            wrapper.addEventListener('mousemove', function(e) {
                if (isMouseDown) {
                    const dx = e.clientX - lastX;
                    const dy = e.clientY - lastY;
                    lastX = e.clientX;
                    lastY = e.clientY;

                    if (Math.hypot(e.clientX - startX, e.clientY - startY) > 3) {
                        hasMovedSignificantly = true;
                        wrapper.classList.add('dragging');
                    }

                    // 两张图在同一微秒里同时平移中心视口！
                    updateUnifiedViewport(dx, dy);
                }

                if (!isLocked) {
                    updateCurtain(e.clientX);
                }
            });

            // 2. 鼠标按下：开始记录拖拽起点
            wrapper.addEventListener('mousedown', function(e) {
                if (e.button === 0 || e.button === 1 || e.button === 2) {
                    isMouseDown = true;
                    hasMovedSignificantly = false;
                    startX = e.clientX;
                    startY = e.clientY;
                    lastX = e.clientX;
                    lastY = e.clientY;
                }
            });

            // 3. 鼠标抬起：判定是拖拽平移还是单击定格
            window.addEventListener('mouseup', function(e) {
                if (isMouseDown) {
                    isMouseDown = false;
                    wrapper.classList.remove('dragging');

                    if (!hasMovedSignificantly && e.button === 0 && wrapper.contains(e.target)) {
                        // 短按轻点：切换锁定/解锁
                        isLocked = !isLocked;
                        lockedClientX = e.clientX;
                        if (isLocked) {
                            laserLine.classList.add('locked');
                            lockIndicator.classList.add('locked');
                            lockIndicator.innerHTML = '🔒 画卷已定格 · 光标可自由移出画卷悬停查阅节点函数名 · 再次单击解除';
                            updateCurtain(lockedClientX);
                        } else {
                            laserLine.classList.remove('locked');
                            lockIndicator.classList.remove('locked');
                            lockIndicator.innerHTML = '🔓 卷帘漫游中 · 任意长按拖动画布 · 单击鼠标左键锁定位置自由悬停节点';
                            updateCurtain(e.clientX);
                        }
                    }
                }
            });

            wrapper.addEventListener('contextmenu', e => e.preventDefault());

            // 4. 滚轮统一同轴缩放：以鼠标指针为锚点同时缩放双图！
            wrapper.addEventListener('wheel', function(e) {
                e.preventDefault();
                const rect = wrapper.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;

                updateUnifiedViewport(0, 0, zoomFactor, mouseX, mouseY);
            }, { passive: false });

            // 初始应用 50% 居中分割与视口归一
            const rect = wrapper.getBoundingClientRect();
            updateCurtain(rect.left + rect.width * 0.5);
            updateUnifiedViewport(0, 0, 1.0, rect.width * 0.5, rect.height * 0.5);
        }

        window.onload = function() {
            initCharts();
            setTimeout(initCurtainSwipe, 50);
        };
    </script>
</body>
</html>
